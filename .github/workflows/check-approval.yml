name: Check Approval & Post

on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 min (GitHub's practical minimum)
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Poll Telegram + post to LinkedIn if approved
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
        run: python scripts/check_and_post.py

      - name: Commit updated state (offset + pending draft)
        run: |
          git config user.name "linkedin-agent-bot"
          git config user.email "actions@github.com"
          git add telegram_offset.json 2>/dev/null || true
          # pending_draft.json is deleted by the script once a draft is
          # approved/edited/rejected -- `git add -A` picks up that removal too.
          git add -A pending_draft.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update agent state [skip ci]"
          git push || true
