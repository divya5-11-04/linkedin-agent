name: Generate LinkedIn Post

on:
  workflow_dispatch:
    inputs:
      repo_full_name:
        description: "Repo to post about, e.g. yourname/your-repo"
        required: true
        type: string
      extra_context:
        description: "Optional extra context (what to emphasize, tone, achievements)"
        required: false
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch target repo README + metadata
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ inputs.repo_full_name }}
        run: python scripts/fetch_repo.py

      - name: Generate draft post via Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EXTRA_CONTEXT: ${{ inputs.extra_context }}
        run: python scripts/generate_post.py

      - name: Send draft to Telegram for approval
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_to_telegram.py
